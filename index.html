<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <meta name="description" content="Play Blackjack in your browser, powered by the Deck of Cards API." />
  <link rel="icon" href="https://deckofcardsapi.com/static/img/favicon/favicon-32x32.png" />
  <link rel="preconnect" href="https://deckofcardsapi.com" />
  <link rel="preconnect" href="https://tvczcrjyywnjdfugqpnp.supabase.co" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="loading" class="screen center">
    <p class="loading-text">Loading…</p>
  </div>

  <div id="login" class="screen center" hidden>
    <div class="login-card">
      <img class="login-art" src="https://deckofcardsapi.com/static/img/AS.png" alt="" width="80" />
      <h1>Blackjack</h1>
      <p>Sign in to take a seat at the table.</p>
      <button id="google-signin" class="google-btn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </div>
  </div>

  <div id="game" class="screen" hidden>
  <header class="topbar">
    <div class="user">
      <img id="avatar" class="avatar" alt="" referrerpolicy="no-referrer" hidden />
      <span id="avatar-initials" class="avatar initials" hidden></span>
      <div class="user-text">
        <span id="greeting" class="greeting"></span>
        <span id="user-email" class="user-email"></span>
      </div>
      <button id="signout" class="btn ghost small">Sign out</button>
    </div>
    <h1>Blackjack</h1>
    <div class="stats">
      <div class="stat"><span class="label">Bankroll</span><span id="bankroll" class="value">$1,000</span></div>
      <div class="stat"><span class="label">Bet</span><span id="bet" class="value">$0</span></div>
      <div class="stat"><span class="label">Shoe</span><span id="shoe" class="value">—</span></div>
    </div>
  </header>

  <main class="table">
    <section class="area dealer" aria-label="Dealer">
      <div class="area-head">
        <h2>Dealer</h2>
        <span id="dealer-score" class="score" hidden></span>
      </div>
      <div id="dealer-cards" class="cards"></div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite">Place your bet to begin.</p>

    <section class="area player" aria-label="Player">
      <div id="player-hands" class="hands"></div>
    </section>
  </main>

  <footer class="controls">
    <div id="betting" class="panel">
      <div class="chips" role="group" aria-label="Add chips">
        <button class="chip chip-5" data-chip="5">5</button>
        <button class="chip chip-25" data-chip="25">25</button>
        <button class="chip chip-100" data-chip="100">100</button>
        <button class="chip chip-500" data-chip="500">500</button>
      </div>
      <div class="actions">
        <button id="clear" class="btn ghost">Clear</button>
        <button id="rebet" class="btn ghost" hidden>Rebet</button>
        <button id="deal" class="btn primary" disabled>Deal <kbd>Enter</kbd></button>
      </div>
    </div>

    <div id="playing" class="panel" hidden>
      <div class="actions">
        <button id="hit" class="btn primary">Hit <kbd>H</kbd></button>
        <button id="stand" class="btn primary">Stand <kbd>S</kbd></button>
        <button id="double" class="btn">Double <kbd>D</kbd></button>
        <button id="split" class="btn">Split <kbd>P</kbd></button>
      </div>
    </div>

    <div id="broke" class="panel" hidden>
      <div class="actions">
        <button id="reset" class="btn primary">Reset bankroll to $1,000</button>
      </div>
    </div>

    <p class="rules">6 decks · Dealer stands on 17 · Blackjack pays 3:2 · Double on any 2 cards · Split up to 4 hands</p>
  </footer>
  </div>

  <script>
    // If the sign-in library can't load (offline, blocked CDN), say so instead of spinning forever.
    setTimeout(function () {
      var l = document.getElementById("loading");
      if (!l.hidden) l.firstElementChild.textContent = "Couldn't load sign-in. Check your connection and refresh.";
    }, 12000);
  </script>
</body>
</html>
